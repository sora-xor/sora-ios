excluded:
  - Pods
  - PrivatePods
  - R.generated.swift
  - SoraPassportTests
  - SoraPassportUITests
  - SoraPassportIntegrationTests

disabled_rules: # rule identifiers to exclude from running
 - inclusive_language
 - comment_spacing

# configurable rules can be customized from this configuration file
# binary rules can set their severity level
line_length: 145
type_body_length: 400
function_body_length: 55
file_length: 500

identifier_name:
  # SwiftLint's default exclusion, plus the coordinate and quaternion components of the
  # geometry and tilt maths (CGPoint-style x/y, sensor quaternion x/y/z/w).
  excluded:
    - "^id$"
    - "^x$"
    - "^y$"
    - "^z$"
    - "^w$"

function_parameter_count:
  warning: 5
  # The VIPER wireframes and view factories carried over from SORA 3.8.0 (2023) pass the wallet's
  # services one by one, up to 20 of them; those signatures stay warnings. New code is held to 5.
  error: 20
